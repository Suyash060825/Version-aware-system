version: "1.0"
registry_metadata:
  system_name: "Veritas Policy Intelligence"
  evaluation_framework: "Reproducible Publication-Ready Benchmarking"
  created_at: "2026-10-21T17:39:00Z"
  deployment_target: "Docker Compose (Postgres+pgvector, Redis, Celery, Ollama qwen3:4b-q4_K_M, FastEmbed BAAI/bge-small-en-v1.5)"

claims:
  - claim_id: "CLM-001"
    historical_id: "C1"
    wording: "Veritas retrieves policy information according to the requested date and applicable version."
    subsystem: "Temporal Retrieval"
    metric_name: "Version-selection accuracy on temporal queries"
    metric_formula: "Count(Correct version selected | query date t_q) / Total temporal queries"
    numerator: "Queries where retrieved policy version interval [start_date, end_date] contains t_q"
    denominator: "Total evaluated temporal queries with valid applicable version"
    unit_of_analysis: "query"
    ground_truth_source: "Independent ground truth temporal resolver"
    test_suite: "tests/system_characterization/suites/test_temporal_semantics.py & evaluation/benchmark.py"
    environment: "Docker Compose, local PostgreSQL 16, pgvector"
    raw_evidence_artifact: "evaluation/results/query_level_results.jsonl"
    acceptance_threshold: ">= 95.0%"
    status: "QUALIFIED"
    limitations: "Dates strictly before earliest version start_date must abstain/return None rather than clamping to earliest version."

  - claim_id: "CLM-002"
    historical_id: "C2 / C003"
    wording: "Retrieval respects user authorization with zero unauthorized evidence leaks entering prompt context or search."
    subsystem: "Authorization & Scope Enforcement"
    metric_name: "Authorization Leakage Rate and Decision Accuracy"
    metric_formula: "Leakage = Leaked_Unauthorized_Chunks / Total_Unauthorized_Evaluations; Accuracy = Correct_Auth_Decisions / Total_Matrix_Evaluations"
    numerator: "Unauthorized chunks admitted (leakage); Correct allow/deny decisions (accuracy)"
    denominator: "3,840 cross-user evaluations (32 users x 120 policies)"
    unit_of_analysis: "user_policy_evaluation"
    ground_truth_source: "AccessControlEvaluator independent RBAC & clearance rules"
    test_suite: "tests/system_characterization/suites/test_authorization_isolation.py & tests/test_independent_validation.py"
    environment: "Docker Compose, isolated PostgreSQL schema, Redis multi-level cache"
    raw_evidence_artifact: "evaluation/results/security_results.json"
    acceptance_threshold: "Leakage Rate == 0.0% (strict zero tolerance)"
    status: "VERIFIED"
    limitations: "Zero leaks verified on 3,840 evaluations (95% upper bound < 0.08%). Requires pre-retrieval QueryScope clearance binding."

  - claim_id: "CLM-003"
    historical_id: "C3 / C001"
    wording: "Knowledge updates process only affected content, avoiding re-embedding for unaffected chunks."
    subsystem: "Incremental Knowledge Compiler"
    metric_name: "Re-embedding Avoidance Ratio"
    metric_formula: "(Total_Corpus_Chunks - Amended_Chunks) / Total_Corpus_Chunks"
    numerator: "2,850 unchanged chunks retained via SHA-256 hash match"
    denominator: "3,000 total corpus chunks under 5% amendment delta"
    unit_of_analysis: "chunk"
    ground_truth_source: "DocumentIR hash diff manifest"
    test_suite: "tests/system_characterization/suites/test_incremental_compiler.py"
    environment: "Local ONNX FastEmbed BAAI/bge-small-en-v1.5"
    raw_evidence_artifact: "evaluation/results/scalability_results.csv"
    acceptance_threshold: "Avoidance Ratio == 95.0% for 5% delta"
    status: "VERIFIED"
    limitations: "Measures chunk re-embedding avoidance; full end-to-end wall-clock speedup depends on database commit and FAISS delta index write overhead."

  - claim_id: "CLM-004"
    historical_id: "C8 / C001"
    wording: "Incremental compilation achieves a 24.95x end-to-end speedup for 5% amendment deltas across 3,000 chunks."
    subsystem: "Incremental Knowledge Compiler"
    metric_name: "End-to-End Compilation Speedup"
    metric_formula: "Full_Rebuild_Wall_Clock_Time / Incremental_Update_Wall_Clock_Time"
    numerator: "Cold rebuild wall-clock duration (52.40s in historical table, ~6.31s FastEmbed)"
    denominator: "Incremental update duration (2.100s in historical table, ~0.33s FastEmbed)"
    unit_of_analysis: "compilation_task"
    ground_truth_source: "Wall-clock timer over real compilation pipeline"
    test_suite: "evaluation/run_incremental_benchmark.py"
    environment: "Docker Compose Celery worker, local CPU FastEmbed"
    raw_evidence_artifact: "evaluation/results/scalability_results.csv"
    acceptance_threshold: ">= 15.0x"
    status: "UNSUPPORTED"
    limitations: "Historical 24.95x figure was a hardcoded table string; actual dynamic neural embedding measured 19.32x, and full pipeline speedup is lower due to I/O and DB transaction overhead."

  - claim_id: "CLM-005"
    historical_id: "C4 / C002"
    wording: "The system supports different types of questions using an adaptive query router, with 63.4% of queries resolving through deterministic or refusal fast paths."
    subsystem: "Adaptive Query Router"
    metric_name: "Deterministic & Refusal Fast-Path Offload Ratio"
    metric_formula: "Count(Tier 0 + Tier 1 + Tier 3 + Refusal) / Total_Characterization_Queries"
    numerator: "585 queries routed to deterministic fast paths or refusal"
    denominator: "922 queries in characterization suite"
    unit_of_analysis: "query"
    ground_truth_source: "QueryGroundTruth expected_route classification"
    test_suite: "tests/system_characterization/suites/test_router_dynamics.py"
    environment: "Docker Compose web/worker, Redis semantic cache"
    raw_evidence_artifact: "evaluation/results/retrieval_metrics.json"
    acceptance_threshold: ">= 50.0%"
    status: "VERIFIED"
    limitations: "Distribution is dependent on corpus question composition. Complex comparative queries lacking regex tokens fall through to hybrid RAG."

  - claim_id: "CLM-006"
    historical_id: "C5"
    wording: "Evidence verification checks whether generated answers are supported via NLI entailment."
    subsystem: "Grounded Verification Layer"
    metric_name: "NLI Contradiction & Entailment Classification Recall"
    metric_formula: "Correct_NLI_Predictions / Total_NLI_Validation_Pairs"
    numerator: "True positives on ENTAILMENT and CONTRADICTION"
    denominator: "Total evaluated assertion pairs"
    unit_of_analysis: "claim_chunk_pair"
    ground_truth_source: "Curated NLI validation dataset"
    test_suite: "tests/system_characterization/suites/test_nli_verification.py & scripts/evaluate_nli_comprehensive.py"
    environment: "Containerized PyTorch CrossEncoder (DeBERTa-v3-base) with lexical fail-closed fallback"
    raw_evidence_artifact: "evaluation/results/answer_quality_metrics.json"
    acceptance_threshold: "Contradiction Recall >= 95.0%"
    status: "VERIFIED"
    limitations: "In containers without PyTorch, verifier fails closed to UNKNOWN; requires PyTorch/DeBERTa runtime for positive semantic entailment."

  - claim_id: "CLM-007"
    historical_id: "C6"
    wording: "The system reliably abstains when valid evidence is insufficient, contradictory, or unauthorized."
    subsystem: "Safe Abstention & Grounding"
    metric_name: "Safe Abstention Rate and False Refusal Rate"
    metric_formula: "Safe Abstention = Correct_Abstentions / Total_Unanswerable_Queries; False Refusal = False_Abstentions / Total_Answerable_Queries"
    numerator: "Correct abstentions on unanswerable/unauthorized queries"
    denominator: "Total unanswerable queries in benchmark"
    unit_of_analysis: "query"
    ground_truth_source: "Ground truth expected_outcome == 'abstain'"
    test_suite: "scripts/audit_grounding_eval.py & tests/test_audit_adversarial.py"
    environment: "Docker Compose full pipeline"
    raw_evidence_artifact: "evaluation/results/answer_quality_metrics.json"
    acceptance_threshold: "Safe Abstention Rate >= 95.0%, False Refusal <= 10.0%"
    status: "VERIFIED"
    limitations: "Conservative confidence thresholding can cause up to 10% false abstentions on valid queries with low lexical overlap."

  - claim_id: "CLM-008"
    historical_id: "C7 / C004"
    wording: "Retrieval achieves 94.5% Recall@1 on the expanded characterization benchmark."
    subsystem: "Hybrid Retrieval Pipeline"
    metric_name: "Policy-Level Recall@1 vs Chunk-Level Recall@1/10"
    metric_formula: "Recall@k = Count(Relevant item in Top-k) / Total_Answerable_Queries"
    numerator: "871/922 queries matching expected policy at rank 1; 85/877 matching expected chunk at rank 1; 862/877 matching chunk at rank 10"
    denominator: "922 queries (policy-level) / 877 answerable queries (chunk-level)"
    unit_of_analysis: "query"
    ground_truth_source: "GroundTruthLedger query-policy-chunk relevance mapping"
    test_suite: "tests/system_characterization/suites/test_retrieval_components.py"
    environment: "BM25 + FastEmbed BAAI/bge-small-en-v1.5 + FlashRank TinyBERT reranker"
    raw_evidence_artifact: "evaluation/results/retrieval_metrics.json"
    acceptance_threshold: "Policy Recall@1 >= 90.0%, Chunk Recall@10 >= 95.0%"
    status: "QUALIFIED"
    limitations: "94.5% is strictly POLICY-LEVEL Recall@1. Strict chunk-level Recall@1 is 9.69% (85/877), while chunk Recall@10 is 98.29% (862/877). Must not conflate policy recall with chunk recall."

  - claim_id: "CLM-009"
    historical_id: "C005"
    wording: "Generation achieves 0.962 Token F1 under fixed gold evidence on 100 queries."
    subsystem: "Local LLM Generation (Qwen3:4b-q4_K_M)"
    metric_name: "Fixed-Evidence Token F1"
    metric_formula: "2 * (Precision * Recall) / (Precision + Recall) over gold-conditioned generation"
    numerator: "Harmonic mean of token overlap between generated answer and gold reference"
    denominator: "100 fixed-evidence query trials"
    unit_of_analysis: "query"
    ground_truth_source: "Fixed gold evidence excerpts and canonical reference answers"
    test_suite: "tests/system_characterization/suites/test_generation_fidelity.py"
    environment: "Local Ollama qwen3:4b-q4_K_M running in Docker Compose"
    raw_evidence_artifact: "evaluation/results/generation_results.json"
    acceptance_threshold: "Token F1 >= 0.85"
    status: "VERIFIED"
    limitations: "Measures surface answer generation given perfect evidence context, isolating generator fidelity from upstream retrieval errors."

  - claim_id: "CLM-010"
    historical_id: "C006"
    wording: "End-to-end exact answer match on the frozen 301-query baseline is 27.91% for local qwen3:4b."
    subsystem: "End-to-End Baseline Evaluation"
    metric_name: "Exact Answer Match Accuracy"
    metric_formula: "Count(Exact Match Answer) / Total_Baseline_Queries"
    numerator: "84 exactly matched answers"
    denominator: "301 baseline queries"
    unit_of_analysis: "query"
    ground_truth_source: "Frozen baseline dataset data/benchmarks/benchmark_test.json"
    test_suite: "scripts/run_reproducible_eval.py"
    environment: "Docker Compose, local Ollama qwen3:4b-q4_K_M"
    raw_evidence_artifact: "evaluation/results/answer_quality_metrics.json"
    acceptance_threshold: ">= 25.0%"
    status: "VERIFIED"
    limitations: "Baseline includes 192 unanswerable or abstaining queries; answered-query version selection accuracy is 88.07% (96/109)."

  - claim_id: "CLM-011"
    historical_id: "C007"
    wording: "Calibration achieves 0.041 validation ECE via isotonic regression, with runtime ECE reaching 0.2954 under distribution shift."
    subsystem: "Confidence Calibration"
    metric_name: "Expected Calibration Error (ECE)"
    metric_formula: "Sum_m ( |B_m| / N ) * | acc(B_m) - conf(B_m) | across 10 confidence bins"
    numerator: "Weighted absolute difference between bin accuracy and bin confidence"
    denominator: "Total evaluated predictions across bins"
    unit_of_analysis: "prediction"
    ground_truth_source: "Validation split and open-distribution test split"
    test_suite: "tests/system_characterization/suites/test_confidence_calibration.py"
    environment: "Scikit-learn isotonic regression calibration module"
    raw_evidence_artifact: "evaluation/results/answer_quality_metrics.json"
    acceptance_threshold: "Validation ECE <= 0.08"
    status: "VERIFIED"
    limitations: "Validation ECE is measured on in-distribution held-out split. Under unconstrained runtime shifts, calibration degrades to ~0.295."

  - claim_id: "CLM-012"
    historical_id: "C008"
    wording: "Load testing across 1 to 100 concurrent workers maintains 100% data isolation, with throughput reaching 234.7 QPS at 1 worker and plateauing near 137 QPS at 50-100 workers."
    subsystem: "Concurrency & Scalability"
    metric_name: "Throughput (QPS), Latency P50/P95 (ms), and Cross-Tenant Scope Leakage"
    metric_formula: "Throughput = Total_Completed_Requests / Total_Elapsed_Time_Seconds; Scope_Leaks = Leaked_Context_Events"
    numerator: "1,000 multi-threaded queries executed across 1, 10, 25, 50, 100 worker threads"
    denominator: "Elapsed wall-clock time per concurrency tier"
    unit_of_analysis: "concurrent_request"
    ground_truth_source: "Multi-threaded concurrency isolation harness"
    test_suite: "tests/system_characterization/suites/test_concurrency_isolation.py"
    environment: "Docker Compose, multi-threaded client, real Redis cache"
    raw_evidence_artifact: "evaluation/results/concurrency_results.csv"
    acceptance_threshold: "0 scope leaks, 0 cache collisions"
    status: "VERIFIED"
    limitations: "Throughput figures describe deterministic fast-path and cached retrieval requests; generative queries through Ollama serialize or bottleneck at ~12-15 tokens/sec per stream."

  - claim_id: "CLM-013"
    historical_id: "C009"
    wording: "100% post-mutation consistency across 20 update cycles preserving active-version retrieval and tombstone purging."
    subsystem: "Index & Cache Consistency"
    metric_name: "Post-Mutation Consistency Rate"
    metric_formula: "Count(Consistent mutation cycles) / Total mutation cycles"
    numerator: "20 cycles with correct active version, historical point-in-time retrieval, and cache invalidation"
    denominator: "20 executed mutation cycles"
    unit_of_analysis: "mutation_cycle"
    ground_truth_source: "PostMutationConsistencyBenchmark state trace"
    test_suite: "tests/system_characterization/suites/test_post_mutation_consistency.py"
    environment: "Docker Compose PostgreSQL, Redis, Chroma, BM25"
    raw_evidence_artifact: "evaluation/results/scalability_results.csv"
    acceptance_threshold: "Consistency Rate == 100.0%"
    status: "VERIFIED"
    limitations: "Requires cache invalidation hook execution on policy amendment."

  - claim_id: "CLM-014"
    historical_id: "C9"
    wording: "The expanded characterization corpus covers 120 policies, 422 versions, 2,110 chunks, and 32 user archetypes (clarifying earlier nominal targets of 600 versions and 3,000 chunks)."
    subsystem: "Benchmark Corpus Integrity"
    metric_name: "Corpus Entity Counts"
    metric_formula: "Exact count of policies, versions, chunks, user profiles"
    numerator: "120 policies, 422 versions, 2,110 chunks, 32 user archetypes"
    denominator: "120 policies, 422 versions, 2,110 chunks, 32 user archetypes"
    unit_of_analysis: "entity"
    ground_truth_source: "GroundTruthLedger manifest"
    test_suite: "scripts/verify_ground_truth_ledger.py"
    environment: "GroundTruthLedger JSON manifest"
    raw_evidence_artifact: "evaluation/results/corpus_manifest.json"
    acceptance_threshold: "120 policies, 422 versions, 2,110 chunks"
    status: "VERIFIED"
    limitations: "Earlier reports mentioned 600 versions and 3,000 chunks as nominal targets; actual verified dataset is 120 policies, 422 versions, and 2,110 chunks."

  - claim_id: "CLM-015"
    historical_id: "C11"
    wording: "Audit tracking preserves full provenance and structured citations for all answered queries."
    subsystem: "Audit & Traceability"
    metric_name: "Audit Log Fidelity and Citation Completeness"
    metric_formula: "Count(Answered queries with valid audit log and structured citation) / Total answered queries"
    numerator: "All answered queries logging user_id, policy_id, version_id, chunk_id, section, timestamp"
    denominator: "Total answered queries"
    unit_of_analysis: "query"
    ground_truth_source: "PostgreSQL audit_log table and CitationValidator"
    test_suite: "tests/test_audit_engineering_pass.py & tests/test_hardening_regression.py"
    environment: "Docker Compose PostgreSQL 16"
    raw_evidence_artifact: "evaluation/results/query_level_results.jsonl"
    acceptance_threshold: "100.0% citation completeness"
    status: "VERIFIED"
    limitations: "Audit log records structured metadata and breadcrumbs; raw prompt text is omitted to prevent database bloat."
