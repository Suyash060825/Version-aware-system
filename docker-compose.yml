services:
  # ============================================================================
  # Nginx Reverse Proxy / Load Balancer & SSL Termination
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: policy_ledger_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      web:
        condition: service_healthy

  # ============================================================================
  # Production Flask + Gunicorn Web Application
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy_ledger_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-9f8c6e2a1b4d7f5e3c8a0b2d4e6f8a1c9e7b5d3f1a0c8e6b4d2f0a8c6e4b2d0f}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-PolicyLedger#Admin2026!}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-policy_ledger}
      - REDIS_URL=redis://redis:6379/0
      - HF_HOME=/app/data/huggingface
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen3:4b-q4_K_M}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      - EMBEDDING_ENGINE=${EMBEDDING_ENGINE:-auto}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - RERANKER_ENGINE=${RERANKER_ENGINE:-auto}
      - RERANKER_MODEL=${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - app_data:/app/data
      - upload_data:/app/data/uploads

  # ============================================================================
  # Celery Asynchronous Ingestion & Contradiction Worker
  # ============================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy_ledger_celery
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-9f8c6e2a1b4d7f5e3c8a0b2d4e6f8a1c9e7b5d3f1a0c8e6b4d2f0a8c6e4b2d0f}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-PolicyLedger#Admin2026!}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-policy_ledger}
      - REDIS_URL=redis://redis:6379/0
      - HF_HOME=/app/data/huggingface
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen3:4b-q4_K_M}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      - EMBEDDING_ENGINE=${EMBEDDING_ENGINE:-auto}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - RERANKER_ENGINE=${RERANKER_ENGINE:-auto}
      - RERANKER_MODEL=${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
      - upload_data:/app/data/uploads

  # ============================================================================
  # PostgreSQL 16 with pgvector extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policy_ledger_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-policy_ledger}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis 7 Cache, L1/L2 Semantic Store & Celery Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: policy_ledger_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Ollama Local High-Throughput Inference Engine
  # ============================================================================
  ollama:
    image: ollama/ollama:0.5.7
    container_name: policy_ledger_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  app_data:
  upload_data:
