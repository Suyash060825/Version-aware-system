name: RAG Evaluation Suite
on:
  pull_request:
    paths:
      - 'rag/**'
      - 'eval/**'
      - 'docker-compose*'

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Golden Questions Eval
        run: |
          python eval/run_eval.py
        env:
          FLASK_ENV: testing
          LLM_BACKEND: extractive # Use extractive fallback for quick CI testing if no LLM
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rag-eval-report
          path: eval/report.md
