
services:
  # ============================================================================
  # Flask Web Application (Dev Mode)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy_ledger_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - LLM_BACKEND=${LLM_BACKEND:-lmstudio}
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-local-model}
      - REDIS_URL=redis://redis:6379/0
      - HF_HOME=/app/data/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app:z
      - app_data:/app/data:z
    depends_on:
      redis:
        condition: service_started

  # ============================================================================
  # Redis Cache & Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: policy_ledger_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  app_data:
  redis_data:

